name: pinhanha2-worker

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"   # backup de hora em hora (o run auto-requeue)

concurrency:
  group: pinhanha2-worker
  cancel-in-progress: false

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: run worker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DERIV_APP_ID: ${{ secrets.DERIV_APP_ID }}
          BOT_PASSWORD: ${{ secrets.BOT_PASSWORD }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python -m app.worker
      - name: requeue
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X POST repos/$GITHUB_REPOSITORY/actions/workflows/pinhanha2-worker.yml/dispatches -f ref=main || true
